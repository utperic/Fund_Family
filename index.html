<div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
    <div class="glass p-8 rounded-3xl lg:col-span-1">
        <h3 class="text-md font-bold mb-6 flex items-center">
            <span class="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>策略資金容量
        </h3>
        <div class="relative h-[400px]"><canvas id="allocationChart"></canvas></div>
    </div>
    <div class="glass p-8 rounded-3xl lg:col-span-2">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-md font-bold flex items-center">
                <span class="w-2 h-2 bg-emerald-500 rounded-full mr-2"></span>淨值走勢與回撤分析
            </h3>
            <div class="flex space-x-4">
                <div class="flex items-center text-[10px] text-emerald-400">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full mr-1"></span> NAV
                </div>
                <div class="flex items-center text-[10px] text-rose-400">
                    <span class="w-2 h-2 bg-rose-400/30 rounded-full mr-1"></span> Drawdown
                </div>
            </div>
        </div>
        <div class="h-[400px]"><canvas id="performanceChart"></canvas></div>
    </div>
</div>

<script>
    // ... RAW_DATA 維持不變 ...

    // 核心圖表邏輯：整合 NAV 與 Drawdown
    const ctx = document.getElementById('performanceChart').getContext('2d');
    
    // 計算 Drawdown 數據點 (從現有 pnl 數據)
    // 假設 RAW_DATA.pnl 已包含 dd 欄位，若無則動態計算
    const navData = RAW_DATA.pnl.map(x => x.nav);
    let maxNav = 0;
    const ddData = navData.map(nav => {
        if (nav > maxNav) maxNav = nav;
        return ((nav - maxNav) / maxNav * 100).toFixed(2);
    });

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: RAW_DATA.pnl.map(x => x.date),
            datasets: [
                {
                    label: 'NAV',
                    data: navData,
                    borderColor: '#10b981',
                    borderWidth: 3,
                    pointBackgroundColor: '#10b981',
                    pointRadius: 3,
                    yAxisID: 'y',
                    zIndex: 2,
                    tension: 0.4
                },
                {
                    label: 'Drawdown (%)',
                    data: ddData,
                    type: 'line',
                    borderColor: 'rgba(244, 63, 94, 0.4)',
                    backgroundColor: 'rgba(244, 63, 94, 0.1)',
                    fill: 'start', // 向 0 填充
                    yAxisID: 'y1',
                    zIndex: 1,
                    pointRadius: 0,
                    tension: 0.2
                }
            ]
        },
        options: {
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    grid: { color: '#1e293b' },
                    ticks: { color: '#94a3b8', font: { family: 'Orbitron' } },
                    title: { display: true, text: 'NAV', color: '#94a3b8', font: { size: 10 } }
                },
                y1: {
                    type: 'linear',
                    display: true,
                    position: 'right',
                    min: -10, // 設定回撤顯示區間，讓它在圖表下方
                    max: 0,
                    grid: { drawOnChartArea: false }, // 不重複畫網格線
                    ticks: { color: '#f43f5e', font: { family: 'Orbitron', size: 9 } },
                    title: { display: true, text: 'Drawdown %', color: '#f43f5e', font: { size: 10 } }
                },
                x: {
                    grid: { display: false },
                    ticks: { color: '#94a3b8', font: { family: 'Orbitron', size: 10 } }
                }
            }
        }
    });

    // ... 其他 Chart (Allocation) 與 Table 渲染邏輯維持不變 ...
</script>
